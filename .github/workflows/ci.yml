name: CI - Sistema de Cadastro

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ── BACK-END ──────────────────────────────────────────
      - name: Instalar dependências do back-end
        working-directory: backend
        run: npm ci

      - name: Lint do back-end
        working-directory: backend
        run: npm run lint || true

      - name: Testes do back-end com cobertura
        working-directory: backend
        run: npm test
        env:
          JWT_SECRET: test_secret_ci
          NODE_ENV: test

      # ── FRONT-END ─────────────────────────────────────────
      - name: Instalar dependências do front-end
        working-directory: frontend
        run: npm ci

      - name: Lint do front-end
        working-directory: frontend
        run: npm run lint || true

      - name: Build do front-end
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      # ── SEGURANÇA ─────────────────────────────────────────
      - name: Verificação de vulnerabilidades (back-end)
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Verificação de vulnerabilidades (front-end)
        working-directory: frontend
        run: npm audit --audit-level=high || true
